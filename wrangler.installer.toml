name = "oneaiworkers-installer"
main = "installer/index.ts"
compatibility_date = "2026-06-27"
keep_vars = true

[vars]
INSTALLER_NAME = "OneAIWorkers"
# Required for production. Must match the verified OAuth client domain.
# PUBLIC_BASE_URL = "https://install.example.com"
# Optional. Usually omitted because allowed permissions are fixed on the OAuth client.
# CF_OAUTH_SCOPES = "scope-id-1 scope-id-2"

# Required secrets:
# CF_OAUTH_CLIENT_ID
# CF_OAUTH_CLIENT_SECRET
# INSTALLER_SESSION_SECRET (at least 32 random characters)
