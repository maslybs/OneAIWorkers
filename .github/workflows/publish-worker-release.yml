name: Publish OneAIWorkers bundle

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-worker-release.yml"
      - "package-lock.json"
      - "package.json"
      - "scripts/build-release-bundle.mjs"
      - "scripts/release-bundle.test.mjs"
      - "src/**"
      - "update-manifest.json"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneaiworkers-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Read source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify types
        run: npm run typecheck

      - name: Run tests and build release files
        run: npm test

      - name: Read version
        id: release
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check whether this bundle is already published
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "publish=true" >> "$GITHUB_OUTPUT"

          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} does not exist yet."
            exit 0
          fi

          EXISTING_RELEASE="$(mktemp -d)"
          trap 'rm -rf "$EXISTING_RELEASE"' EXIT
          gh release download "v${VERSION}" \
            --pattern "oneaiworkers-worker.mjs.sha256" \
            --dir "$EXISTING_RELEASE"

          if cmp -s \
            "release/oneaiworkers-worker.mjs.sha256" \
            "$EXISTING_RELEASE/oneaiworkers-worker.mjs.sha256"; then
            echo "Release v${VERSION} already contains this exact Worker bundle. Nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release v${VERSION} exists, but its Worker bundle is different."
          echo "Increase the OneAIWorkers version before changing release code."
          exit 1

      - name: Publish immutable Worker bundle
        if: steps.existing_release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            release/oneaiworkers-worker.mjs \
            release/oneaiworkers-worker.mjs.sha256 \
            release/oneaiworkers-release.json \
            --target "$GITHUB_SHA" \
            --title "OneAIWorkers ${VERSION}" \
            --notes "Verified OneAIWorkers ${VERSION} bundle for browser installation and updates."
